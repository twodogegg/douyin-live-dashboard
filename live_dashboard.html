<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音直播间 AI 看板</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1d212b; --border: #2a2f3a;
    --text: #e6e8ec; --dim: #8b93a3; --accent: #fe2c55; --accent2: #25f4ee;
    --ai: #7c5cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.6 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-size: 16px; font-weight: 600; white-space: nowrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .dot.on { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
  .dot.err { background: var(--accent); }
  #room { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  .stats { margin-left: auto; display: flex; gap: 14px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .stats b { color: var(--text); font-weight: 600; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  button:hover { border-color: var(--dim); }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; padding: 10px; min-height: 0; }
  .col { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; min-height: 0; }
  .col h2 { font-size: 13px; padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: 600; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .col h2 .tag { font-size: 11px; font-weight: 400; color: var(--dim); margin-left: auto; }
  .feed { flex: 1; overflow-y: auto; padding: 10px 12px; scroll-behavior: smooth; }
  .feed::-webkit-scrollbar { width: 6px; }
  .feed::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .msg { display: flex; gap: 8px; margin-bottom: 8px; animation: fadein .2s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(4px); } }
  .av { flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%; overflow: hidden; background: var(--panel2); }
  .av img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .av i { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-style: normal; font-size: 13px; font-weight: 600; color: #fff; }
  .mbody { flex: 1; min-width: 0; }
  .msg .u { color: var(--accent2); font-size: 12px; margin-right: 6px; }
  .msg .t { color: var(--dim); font-size: 11px; margin-left: 6px; }
  .msg .b { display: inline-block; background: var(--panel2); border-radius: 8px; padding: 6px 10px; margin-top: 2px; word-break: break-word; }
  #r1 .msg .b { border-left: 2px solid var(--accent); }
  #r2 .msg .b { border-left: 2px solid var(--border); }

  .ai-card { background: linear-gradient(135deg, rgba(124,92,255,.14), rgba(37,244,238,.06)); border: 1px solid rgba(124,92,255,.35); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; animation: fadein .3s ease; }
  .ai-card .meta { font-size: 11px; color: var(--dim); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .ai-card .body { white-space: pre-wrap; font-size: 13px; }
  .ai-card.pending .body { color: var(--dim); font-style: italic; }
  .ai-hint { color: var(--dim); font-size: 12px; text-align: center; padding: 20px 10px; }

  #settings { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #settings.open { display: flex; }
  .dlg { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 380px; }
  .dlg h3 { font-size: 15px; margin-bottom: 14px; }
  .dlg label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .dlg input { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; color: var(--text); font-size: 13px; }
  .dlg input:focus { outline: none; border-color: var(--ai); }
  .dlg .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .dlg .primary { background: var(--ai); border-color: var(--ai); color: #fff; }
  .dlg .note { font-size: 11px; color: var(--dim); margin-top: 10px; }
  #saveState { font-size: 12px; color: #2ecc71; margin-left: 8px; }

  #history { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 10; }
  #history.open { display: flex; }
  .dlg.wide { width: 780px; max-width: 92vw; max-height: 86vh; display: flex; flex-direction: column; }
  .dlg h3 .hint { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: 8px; }
  .hlist { flex: 1; overflow-y: auto; margin-top: 6px; }
  .hitem { border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-bottom: 8px; cursor: pointer; background: var(--bg); }
  .hitem:hover { border-color: var(--ai); }
  .hitem .hm { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
  .hitem .hs { white-space: pre-wrap; font-size: 13px; margin-top: 5px; }
  .hitem .hl { display: none; margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 8px; }
  .hitem.open .hl { display: block; }
  .hitem .hl .r2 { font-size: 12px; margin-bottom: 4px; }
  .hitem .hl .r2 .rg { color: var(--dim); font-size: 11px; margin-right: 5px; }
  .hitem .hl .r2 .nm { color: var(--accent2); }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>抖音直播间 AI 看板</h1>
  <span id="room">连接中…</span>
  <div class="stats">
    <span>主播侧 <b id="c1">0</b></span>
    <span>观众侧 <b id="c2">0</b></span>
    <span>AI 摘要 <b id="c3">0</b></span>
    <span id="lastai"></span>
  </div>
  <button id="histBtn">🕘 历史</button>
  <button id="cfgBtn">⚙ 设置</button>
</header>

<main>
  <section class="col">
    <h2>🎤 主播侧<span class="tag">视频区公屏 · 流式上屏</span></h2>
    <div class="feed" id="r1"></div>
  </section>
  <section class="col">
    <h2>🤖 AI 实时摘要<span class="tag" id="aiTag">未配置</span></h2>
    <div class="feed" id="ai">
      <div class="ai-hint" id="aiHint">点右上角「设置」填入 API Key 后，将按时间窗自动生成摘要</div>
    </div>
  </section>
  <section class="col">
    <h2>💬 观众侧<span class="tag">聊天室弹幕</span></h2>
    <div class="feed" id="r2"></div>
  </section>
</main>

<div id="settings">
  <div class="dlg">
    <h3>AI 分析设置</h3>
    <label>Base URL</label>
    <input id="fBase" placeholder="https://api.darl.cn/v1">
    <label>模型</label>
    <input id="fModel" placeholder="gpt-4o-mini">
    <label>API Key（仅存浏览器 localStorage，随请求发到本机后端）</label>
    <input id="fKey" type="password" placeholder="sk-...">
    <label>分析窗口（秒）</label>
    <input id="fWin" type="number" min="5" max="300" value="20">
    <div class="row">
      <span id="saveState"></span>
      <button id="cfgCancel">取消</button>
      <button class="primary" id="cfgSave">保存并应用</button>
    </div>
    <div class="note">Key 不会写入服务器磁盘，仅保存在你自己的浏览器里。</div>
  </div>
</div>

<div id="history">
  <div class="dlg wide">
    <h3>历史摘要<span class="hint">点条目展开该时段的原始消息</span></h3>
    <div class="hlist" id="hList"><div class="ai-hint">加载中…</div></div>
    <div class="row"><button id="histClose">关闭</button></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const r1Nodes = new Map();   // 节点 id -> 气泡元素（流式就地更新）
const MAX_KEEP = 300;
const AV = {};               // 昵称 -> 头像 URL（后端从页面「观众/麦位」卡片采集）
const AV_COLORS = ['#5b8def','#8b5cf6','#e0653f','#2fa36b','#c2557a','#4aa8c0','#9b7a41','#6b7a99'];

// 与后端 norm_name 保持一致：去名次前缀、徽章占位、尾部分数
const norm = s => (s || '').replace(/\s+/g, ' ').trim()
  .replace(/^\d+\s+/, '').replace(/^[-–—]\s*/, '').replace(/\s+\d+$/, '').trim();
function hashColor(name) {
  let h = 0;
  for (const c of (name || '')) h = (h * 31 + c.codePointAt(0)) >>> 0;
  return AV_COLORS[h % AV_COLORS.length];
}
// 有真实头像就用它；没有则用「昵称首字 + 哈希配色」兜底
function avHtml(name) {
  const url = AV[norm(name)];
  if (url) return `<img src="${esc(url)}" referrerpolicy="no-referrer" loading="lazy" alt="">`;
  const ch = Array.from((name || '?').trim())[0] || '?';
  return `<i style="background:${hashColor(name)}">${esc(ch)}</i>`;
}

function trim(feed) {
  while (feed.children.length > MAX_KEEP) feed.removeChild(feed.firstChild);
}
function scrollBottom(feed) {
  const nearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
  if (nearBottom) feed.scrollTop = feed.scrollHeight;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function mkMsg(user, time, fallbackName) {
  const el = document.createElement('div');
  el.className = 'msg';
  el.dataset.user = user || '';
  el.innerHTML = `<span class="av"></span><div class="mbody"><span class="u">${esc(user || fallbackName)}</span><span class="t">${esc(time || '')}</span><br><span class="b"></span></div>`;
  paintAv(el);
  return el;
}
function paintAv(el) {
  const slot = el.querySelector('.av');
  const url = AV[norm(el.dataset.user)] || '';
  if (slot.dataset.url === url) return;
  slot.dataset.url = url;
  slot.innerHTML = avHtml(el.dataset.user);
}
function applyAvatars() {           // 头像池更新后，回填已有气泡（含后端较晚才学到的用户名）
  document.querySelectorAll('.msg[data-user]').forEach(paintAv);
}

function upsertR1(m) {
  if (m.avatar && !AV[norm(m.user)]) AV[norm(m.user)] = m.avatar;
  const feed = $('r1');
  let el = r1Nodes.get(m.id);
  if (!el) {
    // 新的一句：创建一条记录。后端在同一行内复用 m.id，
    // 后续修订只更新 .b 的文本（视觉上就是原网站那样在同一行往后追加）
    el = mkMsg(m.user, m.time, '主播侧');
    feed.appendChild(el);
    r1Nodes.set(m.id, el);
    if (r1Nodes.size > 200) {           // 防内存膨胀，清掉最老节点
      const k = r1Nodes.keys().next().value;
      r1Nodes.delete(k);
    }
    trim(feed);
  }
  el.querySelector('.b').textContent = m.text;
  scrollBottom(feed);
}

function appendR2(m) {
  if (m.avatar && !AV[norm(m.user)]) AV[norm(m.user)] = m.avatar;
  const feed = $('r2');
  const el = mkMsg(m.user, m.time, '');
  el.querySelector('.b').textContent = m.text;
  feed.appendChild(el);
  trim(feed);
  scrollBottom(feed);
}

function appendAI(m, pending) {
  $('aiHint')?.remove();
  const feed = $('ai');
  const el = document.createElement('div');
  el.className = 'ai-card' + (pending ? ' pending' : '');
  el.dataset.slot = m.time;
  el.innerHTML = `<div class="meta"><span>${m.time} · 本时段 ${m.count} 条${m.model ? ' · ' + esc(m.model) : ''}</span></div><div class="body">${pending ? '分析中…' : esc(m.summary)}</div>`;
  feed.appendChild(el);
  trim(feed);
  scrollBottom(feed);
}
function resolveAI(m) {
  const feed = $('ai');
  const el = feed.querySelector(`.ai-card.pending[data-slot="${m.time}"]`);
  if (el) {
    el.classList.remove('pending');
    el.querySelector('.body').textContent = m.summary;
    el.querySelector('.meta').innerHTML = `<span>${m.time} · 本时段 ${m.count} 条 · ${esc(m.model)}</span>`;
  } else appendAI(m, false);
}

function setStat(s) {
  $('c1').textContent = s.r1_count;
  $('c2').textContent = s.r2_count;
  $('c3').textContent = s.ai_count;
  $('room').textContent = s.room ? `${s.room}（${s.status}）` : s.status;
  $('lastai').textContent = s.last_ai ? '上次摘要 ' + s.last_ai : '';
  const dot = $('dot');
  dot.className = 'dot' + (s.status === '已进房' ? ' on' : (s.status.includes('异常') ? ' err' : ''));
}

let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'r1') upsertR1(m);
    else if (m.type === 'r2') appendR2(m);
    else if (m.type === 'avatars') { Object.assign(AV, m.map || {}); applyAvatars(); }
    else if (m.type === 'ai_pending') appendAI(m, true);
    else if (m.type === 'ai') resolveAI(m);
    else if (m.type === 'stat') setStat(m);
  };
  ws.onclose = () => {
    $('room').textContent = '连接断开，3s 后重连…';
    $('dot').className = 'dot err';
    setTimeout(connect, 3000);
  };
}
connect();

// ---------- 设置面板 ----------
const LS = { base: 'dy.base', model: 'dy.model', key: 'dy.key', win: 'dy.win' };
function openCfg() {
  $('fBase').value = localStorage.getItem(LS.base) || 'https://api.darl.cn/v1';
  $('fModel').value = localStorage.getItem(LS.model) || 'gpt-4o-mini';
  $('fKey').value = localStorage.getItem(LS.key) || '';
  $('fWin').value = localStorage.getItem(LS.win) || '20';
  $('saveState').textContent = '';
  $('settings').classList.add('open');
}
$('cfgBtn').onclick = openCfg;
$('cfgCancel').onclick = () => $('settings').classList.remove('open');
$('settings').onclick = e => { if (e.target.id === 'settings') $('settings').classList.remove('open'); };
$('cfgSave').onclick = async () => {
  const conf = {
    base_url: $('fBase').value.trim(), model: $('fModel').value.trim(),
    key: $('fKey').value.trim(), window: parseInt($('fWin').value) || 20,
  };
  localStorage.setItem(LS.base, conf.base_url);
  localStorage.setItem(LS.model, conf.model);
  localStorage.setItem(LS.key, conf.key);
  localStorage.setItem(LS.win, conf.window);
  const r = await fetch('/config', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(conf),
  }).then(r => r.json()).catch(() => null);
  $('saveState').textContent = r && r.ok ? '已应用 ✓' : '保存失败';
  $('aiTag').textContent = r && r.has_key ? `${conf.model} · 每 ${conf.window}s` : '未配置';
  setTimeout(() => $('settings').classList.remove('open'), 600);
};
// ---------- 历史回看（摘要与消息已落库，刷新/重启后仍在） ----------
$('histBtn').onclick = async () => {
  $('history').classList.add('open');
  const list = $('hList');
  list.innerHTML = '<div class="ai-hint">加载中…</div>';
  const d = await fetch('/history').then(r => r.json()).catch(() => null);
  const wins = (d && d.windows) || [];
  if (!wins.length) { list.innerHTML = '<div class="ai-hint">暂无历史摘要</div>'; return; }
  list.innerHTML = '';
  wins.forEach(w => {
    const el = document.createElement('div');
    el.className = 'hitem';
    el.innerHTML = `<div class="hm"><span>${esc(w.time)} · 本时段 ${w.n} 条${w.model ? ' · ' + esc(w.model) : ''}</span><span>#${w.id}</span></div>` +
                   `<div class="hs">${esc(w.summary || '（分析中…）')}</div><div class="hl"></div>`;
    el.onclick = async () => {
      el.classList.toggle('open');
      const box = el.querySelector('.hl');
      if (!el.classList.contains('open') || box.dataset.loaded) return;
      box.dataset.loaded = '1';
      const r = await fetch('/history/' + w.id).then(r => r.json()).catch(() => null);
      const msgs = (r && r.messages) || [];
      box.innerHTML = msgs.length
        ? msgs.map(m => `<div class="r2"><span class="rg">${m.region === 'r1' ? '主播' : '观众'}</span>` +
                        `<span class="nm">${esc(m.user || '—')}</span> ${esc(m.text)}</div>`).join('')
        : '<div class="r2" style="color:var(--dim)">无原始消息</div>';
    };
    list.appendChild(el);
  });
};
$('histClose').onclick = () => $('history').classList.remove('open');
$('history').onclick = e => { if (e.target.id === 'history') $('history').classList.remove('open'); };

// 页面加载时若本地已有 key，自动下发给后端
(async () => {
  const key = localStorage.getItem(LS.key);
  if (key) {
    const conf = {
      base_url: localStorage.getItem(LS.base) || 'https://api.darl.cn/v1',
      model: localStorage.getItem(LS.model) || 'gpt-4o-mini',
      key, window: parseInt(localStorage.getItem(LS.win)) || 20,
    };
    const r = await fetch('/config', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(conf) }).then(r => r.json()).catch(() => null);
    if (r && r.ok) $('aiTag').textContent = `${conf.model} · 每 ${conf.window}s`;
  }
})();
</script>
</body>
</html>
